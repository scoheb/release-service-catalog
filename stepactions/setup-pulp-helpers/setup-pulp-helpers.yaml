---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: setup-pulp-helpers
spec:
  description: >-
    Writes Pulp helper functions to a shell script that can be sourced by subsequent steps.
    Includes helpers for cli.toml parsing, authentication (basic/OAuth2), and async task
    polling with queue position reporting.
  image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
  params:
    - name: pulpSecretPath
      type: string
      description: Path to the mounted Pulp secret containing cli.toml
      default: /etc/secrets
    - name: helpersPath
      type: string
      description: Path where pulp-helpers.sh will be written
      default: /var/workdir/pulp-helpers.sh
    - name: pulpTaskTimeout
      type: string
      description: Maximum time in seconds to wait for Pulp async tasks (default 7200 = 2 hours)
      default: "7200"
  results:
    - name: helpersPath
      description: Path to the generated pulp-helpers.sh script
  script: |
    #!/bin/bash
    set -euo pipefail

    # Use hardcoded paths matching the param defaults
    HELPERS_PATH="/var/workdir/pulp-helpers.sh"
    PULP_SECRET_PATH="/etc/secrets"
    PULP_TASK_TIMEOUT="7200"

    mkdir -p "$$(dirname "${HELPERS_PATH}")"

    cat > "${HELPERS_PATH}" << 'PULP_HELPERS_EOF'
    # Pulp Helper Functions
    # Source this file to use: source /var/workdir/pulp-helpers.sh

    # Initialize Pulp configuration from cli.toml secret
    # Usage: pulp_init_config /path/to/secrets
    pulp_init_config() {
      local secret_path="${1:-/etc/secrets}"

      PULP_CONFIG_FILE_CONTENT="$(cat "${secret_path}/cli.toml" 2>/dev/null || true)"
      if [[ -z "${PULP_CONFIG_FILE_CONTENT}" ]]; then
        echo "Error: Missing cli.toml in ${secret_path}" >&2
        return 1
      fi
      echo "${PULP_CONFIG_FILE_CONTENT}" > "/tmp/cli.toml"
      export PULP_CONFIG_FILE="/tmp/cli.toml"

      # Extract and export base URL
      PULP_BASE_URL="$(pulp_toml_get_required "base_url" | sed 's:/*$::')" || return 1
      export PULP_BASE_URL

      # Extract credentials
      PULP_CLIENT_ID="$(pulp_toml_get_optional "client_id")"
      PULP_CLIENT_SECRET="$(pulp_toml_get_optional "client_secret")"
      PULP_USERNAME="$(pulp_toml_get_optional "username")"
      PULP_PASSWORD="$(pulp_toml_get_optional "password")"
      export PULP_CLIENT_ID PULP_CLIENT_SECRET PULP_USERNAME PULP_PASSWORD

      # Detect auth method
      PULP_AUTH_METHOD="unknown"
      if [[ -n "${PULP_USERNAME}" && -n "${PULP_PASSWORD}" ]]; then
        PULP_AUTH_METHOD="basic"
      elif [[ -n "${PULP_CLIENT_ID}" && -n "${PULP_CLIENT_SECRET}" ]]; then
        PULP_AUTH_METHOD="oauth2-bearer"
      fi
      export PULP_AUTH_METHOD
      echo "Auth method detected for Pulp API calls: ${PULP_AUTH_METHOD}"
    }

    # Read optional value from cli.toml
    pulp_toml_get_optional() {
      local key="$1"
      if [[ ! "${key}" =~ ^[A-Za-z0-9_]+$ ]]; then
        echo "Error: Invalid cli.toml key '${key}'" >&2
        return 1
      fi

      local line current_table=""
      while IFS= read -r line || [[ -n "${line}" ]]; do
        if [[ "${line}" =~ ^[[:space:]]*\\[([^]]+)\\][[:space:]]*$ ]]; then
          current_table="${BASH_REMATCH[1]}"
          continue
        fi
        if [[ "${line}" =~ ^[[:space:]]*# ]] || [[ "${line}" =~ ^[[:space:]]*$ ]]; then
          continue
        fi
        if [[ -n "${current_table}" && "${current_table}" != "cli" ]]; then
          continue
        fi
        if [[ "${line}" =~ ^[[:space:]]*${key}[[:space:]]*= ]]; then
          if [[ "${line}" =~ \"([^\"]*)\" ]]; then
            echo "${BASH_REMATCH[1]}"
            return 0
          fi
          if [[ "${line}" =~ \'([^\']*)\' ]]; then
            echo "${BASH_REMATCH[1]}"
            return 0
          fi
          echo ""
          return 0
        fi
      done < "${PULP_CONFIG_FILE}"

      echo ""
      return 0
    }

    # Read required value from cli.toml
    pulp_toml_get_required() {
      local key="$1"
      local value
      value="$(pulp_toml_get_optional "${key}")"
      if [[ -z "${value}" ]]; then
        echo "Error: Missing required '${key}' in cli.toml" >&2
        return 1
      fi
      echo "${value}"
    }

    # Get OAuth2 access token
    pulp_get_access_token() {
      local default_token_url="https://sso.redhat.com/auth/realms/redhat-external"
      default_token_url+="/protocol/openid-connect/token"
      local token_url="${PULP_TOKEN_URL:-${default_token_url}}"

      if [[ -z "${PULP_CLIENT_ID}" || -z "${PULP_CLIENT_SECRET}" ]]; then
        echo "Error: client_id/client_secret not present; cannot use OAuth2 Bearer token flow" >&2
        return 1
      fi
      local token
      token=$(curl --retry 3 -s -X POST "${token_url}" \
        -u "${PULP_CLIENT_ID}:${PULP_CLIENT_SECRET}" \
        -d "grant_type=client_credentials" \
        -d "scope=api.console" | jq -r '.access_token')

      if [[ -z "${token}" || "${token}" == "null" ]]; then
        echo "Error: Failed to get OAuth2 access token" >&2
        return 1
      fi
      echo "${token}"
    }

    # Get Authorization header based on available credentials
    pulp_get_auth_header() {
      case "${PULP_AUTH_METHOD}" in
        basic)
          local basic
          basic="$(printf '%s' "${PULP_USERNAME}:${PULP_PASSWORD}" | base64 -w0)"
          echo "Authorization: Basic ${basic}"
          return 0
          ;;
        oauth2-bearer)
          local access_token
          access_token="$(pulp_get_access_token)" || return 1
          echo "Authorization: Bearer ${access_token}"
          return 0
          ;;
        *)
          echo "Error: No supported credentials found in cli.toml." >&2
          echo "Provide either username/password or client_id/client_secret." >&2
          return 1
          ;;
      esac
    }

    # Poll Pulp task until completed/failed with queue position reporting
    # Usage: pulp_wait_for_task <task_url> <auth_header> [max_wait_secs] [poll_interval] [description]
    # Returns 0 if completed, 1 on failure/timeout
    pulp_wait_for_task() {
      local task_url="$1"
      local auth_header="$2"
      local max_wait_secs="${3:-__PULP_TASK_TIMEOUT__}"
      local poll_interval_secs="${4:-5}"
      local description="${5:-}"
      local elapsed=0
      local state response task_name task_info
      local printed_task_url=false

      while [[ ${elapsed} -lt ${max_wait_secs} ]]; do
        response="$(curl --retry 3 -s -H "${auth_header}" "${task_url}")"
        state="$(jq -r '.state // empty' <<< "${response}" 2>/dev/null)"

        # Print task URL once on first iteration
        if [[ "${printed_task_url}" == false ]]; then
          echo "Pulp task created: ${task_url}"
          printed_task_url=true
        fi

        # Handle invalid/empty response (transient API error)
        if [[ -z "${state}" ]]; then
          echo "Warning: Could not parse Pulp response, retrying... (${elapsed}s)"
          sleep "${poll_interval_secs}"
          (( elapsed += poll_interval_secs )) || true
          continue
        fi

        # Extract task name from response for better logging
        task_name="$(jq -r '.name // empty' <<< "${response}" 2>/dev/null)"
        if [[ -n "${description}" ]]; then
          task_info="${description}"
          [[ -n "${task_name}" ]] && task_info="${description} [${task_name}]"
        elif [[ -n "${task_name}" ]]; then
          task_info="${task_name}"
        else
          task_info="Pulp task"
        fi

        if [[ "${state}" == "completed" ]]; then
          echo "[completed] ${task_info} (${task_url})"
          return 0
        fi

        if [[ "${state}" == "failed" ]]; then
          echo "[failed] ${task_info} (${task_url})" >&2
          jq -r '.error // .description // "No details"' <<< "${response}" >&2
          return 1
        fi

        if [[ "${state}" == "waiting" ]]; then
          local task_created tasks_url ahead_response ahead_count
          task_created="$(jq -r '.pulp_created // empty' <<< "${response}")"
          if [[ -n "${task_created}" ]]; then
            tasks_url="$(echo "${task_url}" | sed -E 's|/[^/]+/?$|/|')"
            local encoded_time
            encoded_time="$(jq -nr --arg v "${task_created}" '$v | @uri')"
            ahead_response="$(curl --retry 3 -s -H "${auth_header}" \
              "${tasks_url}?state=waiting&state=running&pulp_created__lt=${encoded_time}&ordering=pulp_created")"
            ahead_count="$(jq -r '.count // 0' <<< "${ahead_response}")"

            if [[ "${ahead_count}" -gt 0 ]]; then
              local blocking_task blocking_state blocking_desc
              blocking_task="$(jq -r '
                ([.results[] | select(.state=="running")][0] // .results[0]) // empty
              ' <<< "${ahead_response}")"

              if [[ -n "${blocking_task}" ]]; then
                blocking_state="$(jq -r '.state // "unknown"' <<< "${blocking_task}")"

                # Build human-readable description of what the blocking task is doing
                blocking_desc="$(jq -r '
                  def get_repo:
                    ((.reserved_resources_record // [])[] |
                      select(contains("/repositories/")) |
                      split("/") | .[-2]) // null;

                  def get_file:
                    (.kwargs.relative_path // empty) //
                    ((.kwargs.file // "") | split("/") | .[-1] | select(. != "")) //
                    ((.args // [])[0] | strings | split("/") | .[-1] |
                      select(. != "" and (endswith(".rpm") or endswith(".json") or
                             endswith(".sbom") or endswith(".att")))) //
                    null;

                  def task_action:
                    (.name // "") |
                    if contains("add_and_remove") then "Modifying repo"
                    elif contains("upload") then "Uploading"
                    elif contains("copy") then "Copying content"
                    elif contains("sync") then "Syncing"
                    elif contains("publish") then "Publishing"
                    elif contains("repair") then "Repairing"
                    elif contains("delete") then "Deleting"
                    elif contains("create") then "Creating"
                    else "Processing"
                    end;

                  task_action as $action |
                  get_repo as $repo |
                  get_file as $file |

                  if $file and $repo then "\($action) \($file) in \($repo)"
                  elif $file then "\($action) \($file)"
                  elif $repo then "\($action) \($repo)"
                  else "\($action) (\(.name // "unknown task"))"
                  end
                ' <<< "${blocking_task}" 2>/dev/null || echo "Unknown task")"

                echo "Waiting: ${task_info} (${elapsed}s). Tasks ahead: ${ahead_count}"
                echo "  Blocked by [${blocking_state}]: ${blocking_desc}"
              else
                echo "Waiting: ${task_info} (${elapsed}s). Tasks ahead: ${ahead_count}"
              fi
            else
              echo "Waiting: ${task_info} (${elapsed}s). Tasks ahead: 0 (task should start soon)"
            fi
          else
            if [[ "${state}" == "running" ]]; then
              echo "Running: ${task_info} (${elapsed}s)..."
            else
              echo "Waiting: ${task_info} (state=${state}, ${elapsed}s)..."
            fi
          fi
        else
          if [[ "${state}" == "running" ]]; then
            echo "Running: ${task_info} (${elapsed}s)..."
          else
            echo "Waiting: ${task_info} (state=${state}, ${elapsed}s)..."
          fi
        fi

        sleep "${poll_interval_secs}"
        (( elapsed += poll_interval_secs )) || true
      done

      echo "[timeout] ${task_info} (${task_url})" >&2
      return 1
    }

    # Upload file to Pulp file repository via REST API
    # Usage: pulp_file_upload <domain> <repo_name> <local_file> <relative_path> [max_wait]
    # Returns JSON response with pulp_href on success
    pulp_file_upload() {
      local domain="$1"
      local repo_name="$2"
      local local_file="$3"
      local relative_path="$4"
      local max_wait="${5:-__PULP_TASK_TIMEOUT__}"
      local filename
      filename="$(basename "${relative_path}")"

      set +x
      local auth_header
      auth_header="$(pulp_get_auth_header)" || return 1

      # Get repository href first
      local repo_href repo_response
      repo_response=$(curl --retry 3 -s -H "${auth_header}" \
        "${PULP_BASE_URL}/api/pulp/${domain}/api/v3/repositories/file/file/?name=${repo_name}")
      repo_href="$(jq -r '.results[0].pulp_href // empty' <<< "${repo_response}")"
      if [[ -z "${repo_href}" || "${repo_href}" == "null" ]]; then
        echo "Error: Repository '${repo_name}' not found" >&2
        return 1
      fi

      # Step 1: Create artifact SYNCHRONOUSLY (this is what pulp-cli does)
      # The artifact endpoint returns 201 immediately, no async task needed
      echo "Uploading artifact: ${local_file}"
      local artifact_response artifact_http artifact_body artifact_href
      artifact_response=$(curl --retry 3 -s -w "\n%{http_code}" \
        -X POST "${PULP_BASE_URL}/api/pulp/${domain}/api/v3/artifacts/" \
        -H "${auth_header}" \
        -F "file=@${local_file}")
      artifact_http="$(echo "${artifact_response}" | tail -n1)"
      artifact_body="$(echo "${artifact_response}" | sed '$d')"

      if [[ "${artifact_http}" != "201" ]]; then
        echo "Error: Artifact upload returned HTTP ${artifact_http}" >&2
        echo "${artifact_body}" >&2
        return 1
      fi
      artifact_href="$(jq -r '.pulp_href // empty' <<< "${artifact_body}")"
      if [[ -z "${artifact_href}" ]]; then
        echo "Error: No pulp_href in artifact response" >&2
        return 1
      fi

      # Step 2: Create content with artifact href + repository
      # This dispatches general_create async task, but file is already uploaded
      echo "Creating content: ${relative_path} -> ${repo_name}"
      local content_response content_http content_body task_href
      content_response=$(curl --retry 3 -s -w "\n%{http_code}" \
        -X POST "${PULP_BASE_URL}/api/pulp/${domain}/api/v3/content/file/files/" \
        -H "${auth_header}" \
        -H "Content-Type: application/json" \
        -d "{\"artifact\": \"${artifact_href}\", \"relative_path\": \"${relative_path}\", \"repository\": \"${repo_href}\"}")
      content_http="$(echo "${content_response}" | tail -n1)"
      content_body="$(echo "${content_response}" | sed '$d')"

      if [[ "${content_http}" == "202" ]]; then
        task_href="$(jq -r '.task // empty' <<< "${content_body}")"
        if [[ -n "${task_href}" && "${task_href}" != "null" ]]; then
          local task_url
          if [[ "${task_href}" == http://* || "${task_href}" == https://* ]]; then
            task_url="${task_href}"
          else
            task_url="${PULP_BASE_URL}${task_href}"
          fi
          pulp_wait_for_task "${task_url}" "${auth_header}" "${max_wait}" 5 \
            "Create content: ${filename}" || return 1
        fi
      elif [[ "${content_http}" != "201" ]]; then
        echo "Error: Content creation returned HTTP ${content_http}" >&2
        echo "${content_body}" >&2
        return 1
      fi

      # Get the content href from response
      local content_href
      content_href="$(jq -r '.pulp_href // empty' <<< "${content_body}")"
      if [[ -z "${content_href}" ]]; then
        # If 202, content was created async - fetch it
        content_response=$(curl --retry 3 -s -H "${auth_header}" \
          "${PULP_BASE_URL}/api/pulp/${domain}/api/v3/content/file/files/?relative_path=${relative_path}")
        content_href="$(jq -r '.results[0].pulp_href // empty' <<< "${content_response}")"
      fi

      if [[ -z "${content_href}" || "${content_href}" == "null" ]]; then
        echo "Error: Could not get content href for ${relative_path}" >&2
        return 1
      fi

      set -x
      echo "Successfully uploaded ${relative_path} to ${repo_name}"
      echo "{\"pulp_href\": \"${content_href}\"}"
    }
    PULP_HELPERS_EOF

    # Replace placeholder with actual timeout value
    sed -i "s/__PULP_TASK_TIMEOUT__/${PULP_TASK_TIMEOUT}/g" "${HELPERS_PATH}"

    chmod +x "${HELPERS_PATH}"
    echo "Pulp helpers written to: ${HELPERS_PATH}"

    # Write result
    echo -n "${HELPERS_PATH}" > /tekton/results/helpersPath
