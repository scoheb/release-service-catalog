---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' &&
          $CI_MERGE_REQUEST_EVENT_TYPE != 'merge_train'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' &&
          $CI_MERGE_REQUEST_EVENT_TYPE == 'merge_train'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - build
  - deploy

default:
  tags: [small-runner]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - job_execution_timeout

variables:
  BUNDLE_REPO: quay.io/hummingbird-ci/release-bundles

.rules:
  mr: &mr
    if: $CI_PIPELINE_SOURCE == 'merge_request_event' &&
        $CI_MERGE_REQUEST_EVENT_TYPE != 'merge_train'
  mr_train: &mr_train
    if: $CI_PIPELINE_SOURCE == 'merge_request_event' &&
        $CI_MERGE_REQUEST_EVENT_TYPE == 'merge_train'
  mr_manual:
    if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    when: manual
    allow_failure: true
  main: &main
    if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

yaml:validate:
  image: quay.io/hummingbird-ci/gitlab-ci:latest
  stage: check
  script:
    - |
      echo "Validating YAML files..."
      for file in tasks/**/*.yaml pipelines/**/*.yaml; do
        if [[ -f "$file" ]]; then
          echo "Validating $file..."
          yq eval '.' "$file" > /dev/null || exit 1
        fi
      done
  rules:
    - !reference [.rules, mr]
    - !reference [.rules, mr_train]

.bundle-push:
  image: ghcr.io/tektoncd/plumbing/tkn:latest
  before_script:
    - pip install --quiet ruamel.yaml

bundles:test:
  extends: .bundle-push
  stage: build
  script:
    - |
      .gitlab/scripts/build-and-push-bundles.sh \
        --registry "${BUNDLE_REPO}" \
        --tag "pipeline-${CI_PIPELINE_ID}" \
        --expire 7d \
        --username "$QUAY_USERNAME" \
        --password "$QUAY_PASSWORD"
  rules:
    - !reference [.rules, mr]

bundles:release:
  extends: .bundle-push
  stage: deploy
  script:
    - |
      .gitlab/scripts/build-and-push-bundles.sh \
        --registry "${BUNDLE_REPO}" \
        --tag "git-${CI_COMMIT_SHA}" \
        --latest \
        --username "$QUAY_USERNAME" \
        --password "$QUAY_PASSWORD"
  rules:
    - !reference [.rules, mr_manual]
    - !reference [.rules, main]
